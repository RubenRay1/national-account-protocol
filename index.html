<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>National Account Protocol - Secure Portal</title>
  <script src="https://unpkg.com/aws-amplify@5.3.12/dist/aws-amplify.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      background: #0c1a2e;
      background: linear-gradient(170deg, #0c1a2e 0%, #14365e 35%, #1b5590 70%, #2470b0 100%);
      background-attachment: fixed;
      color: #2d3748;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: white;
      padding: 1.25rem 1.5rem 1.4rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 {
      font-size: 1.55rem;
      margin-bottom: 0.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .header p {
      font-size: 0.82rem;
      opacity: 0.55;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
    }

    /* TAB BAR */
    .tab-bar {
      display: flex;
      margin-bottom: 0.75rem;
      background: rgba(255,255,255,0.08);
      border-radius: 11px;
      padding: 3px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.7rem;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: rgba(255,255,255,0.55);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
    }
    .tab-btn:hover {
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.06);
    }
    .tab-btn.active {
      background: white;
      color: #14365e;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      font-weight: 700;
    }

    /* SEARCH */
    .search-section {
      background: white;
      padding: 1rem 1.15rem;
      border-radius: 11px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 14px rgba(0,0,0,0.05);
      margin-bottom: 0.75rem;
    }
    .search-input-wrap { position: relative; width: 100%; }
    .search-box {
      width: 100%;
      padding: 0.65rem 0.85rem;
      padding-right: 2.4rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 0.5rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #f7f8fa;
      color: #2d3748;
    }
    .search-box:focus {
      outline: none;
      border-color: #2470b0;
      box-shadow: 0 0 0 3px rgba(36,112,176,0.08);
      background: white;
    }
    .search-box::placeholder { color: #a0aec0; font-size: 13px; }

    .clear-btn {
      position: absolute;
      right: 0.55rem;
      top: 34%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a0aec0;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .clear-btn:hover { background: #edf2f7; color: #718096; }
    .clear-btn:focus { outline: none; box-shadow: 0 0 0 2px rgba(36,112,176,0.12); }

    .stats {
      text-align: center;
      color: #a0aec0;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.015em;
    }

    /* LOADING / SKELETON */
    .loading {
      text-align: center;
      padding: 2.5rem;
      color: #a0aec0;
      background: white;
      border-radius: 11px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 14px rgba(0,0,0,0.05);
      font-size: 0.85rem;
    }
    .skeleton-card {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .sk-line {
      height: 10px;
      border-radius: 5px;
      margin: 8px 0;
      background: linear-gradient(90deg, #edf2f7, #f7fafc, #edf2f7);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    .sk-line.w40 { width: 40%; }
    .sk-line.w60 { width: 60%; }
    .sk-line.w80 { width: 80%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* RECORD CARDS */
    .records-grid { display: grid; gap: 0.45rem; }

    .record-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 1px 6px rgba(0,0,0,0.03);
      overflow: hidden;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .record-card:hover {
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }

    .record-header {
      background: linear-gradient(135deg, #14365e 0%, #1b5590 50%, #2470b0 100%);
      color: white;
      padding: 0.8rem 1rem;
      font-weight: 600;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.005em;
    }
    .record-header-title { flex: 1; min-width: 0; }

    .expand-icon {
      font-size: 0.95rem;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .record-card.expanded .expand-icon { transform: rotate(180deg); opacity: 1; }

    .record-content {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.25s ease;
    }
    .record-card.expanded .record-content {
      padding: 1rem 1.15rem;
      max-height: none;
    }

    /* FIELD GRID */
    .field-grid { display: grid; gap: 0; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 2.5fr;
      gap: 0.65rem;
      align-items: baseline;
      border-bottom: 1px solid #f0f3f7;
      padding: 0.55rem 0;
    }
    .field-row:last-child { border-bottom: none; }
    .field-label {
      font-weight: 600;
      color: #14365e;
      font-size: 0.74rem;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }
    .field-value {
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: anywhere;
      hyphens: auto;
      color: #4a5568;
      font-size: 0.84rem;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .header { padding: 1rem 0.75rem 1.1rem; }
      .header h1 { font-size: 1.2rem; }
      .header p { font-size: 0.75rem; }
      .container { padding: 0.6rem; }
      .tab-bar { border-radius: 9px; padding: 3px; }
      .tab-btn { font-size: 0.72rem; padding: 0.5rem 0.35rem; border-radius: 7px; }
      .search-section { padding: 0.75rem; border-radius: 9px; }
      .search-box { padding: 0.6rem 0.7rem; padding-right: 2.1rem; font-size: 14px; border-radius: 7px; }
      .records-grid { gap: 0.35rem; }
      .record-card { border-radius: 9px; }
      .record-header { padding: 0.7rem 0.85rem; font-size: 0.85rem; }
      .record-card.expanded .record-content { padding: 0.8rem; }
      .field-row { grid-template-columns: 1fr; gap: 0.12rem; padding: 0.55rem 0; }
      .field-label { font-size: 0.78rem; color: #1b5590; }
      .field-value { font-size: 0.85rem; line-height: 1.5; color: #4a5568; }
    }

    /* MISC */
    .no-results {
      text-align: center;
      padding: 2.5rem;
      color: #a0aec0;
      background: white;
      border-radius: 11px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 14px rgba(0,0,0,0.05);
      font-size: 0.85rem;
    }
    .load-more-wrap { display: flex; justify-content: center; margin: 0.75rem 0 2rem 0; }
    .load-more-btn {
      background: linear-gradient(135deg, #d96a0a 0%, #F47920 100%);
      color: white;
      border: none;
      padding: 0.6rem 1.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 2px 6px rgba(244,121,32,0.2);
    }
    .load-more-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(244,121,32,0.25); }
    .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .bms-badge {
      display: inline-block;
      background: linear-gradient(135deg, #d96a0a 0%, #F47920 100%);
      color: white;
      padding: 0.12rem 0.5rem;
      border-radius: 20px;
      font-size: 0.55rem;
      font-weight: 700;
      margin-left: 0.4rem;
      vertical-align: middle;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* AUTH */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(170deg, #0c1a2e 0%, #14365e 35%, #1b5590 70%, #2470b0 100%);
    }
    .auth-card {
      background: white;
      padding: 2.25rem 1.75rem;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
    .auth-card h1 { color: #14365e; font-size: 1.3rem; font-weight: 700; }
    .auth-button {
      background: linear-gradient(135deg, #14365e 0%, #1b5590 50%, #2470b0 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      margin-top: 1rem;
      box-shadow: 0 2px 6px rgba(20,54,94,0.18);
    }
    .auth-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(20,54,94,0.25);
    }
    .user-info {
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 0.45rem 0.85rem;
      border-radius: 7px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0.7;
    }
    .logout-btn {
      background: #F47920;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
    }
    #logoutBtn { display: none !important; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-container">
    <div class="auth-card">
      <h1>National Account Protocol <span class="bms-badge">BMS</span></h1>
      <p style="margin: 1rem 0; color: #666;">Secure access to customer data</p>
      <button id="loginBtn" class="auth-button">Sign In with OKTA</button>
    </div>
  </div>

  <div id="mainApp" class="hidden">
    <div class="header">
      <div class="user-info">
        <span id="userEmail">Loading...</span>
        <button id="logoutBtn" class="logout-btn">Sign Out</button>
      </div>
      <h1> National Account Protocol <span class="bms-badge">BMS CAT</span></h1>
      <p>National Account Protocol Search Portal</p>
    </div>

    <div class="container">
      <div class="tab-bar">
        <button class="tab-btn active" data-sheet="National Account Protocols">National Account Protocols</button>
        <button class="tab-btn" data-sheet="FCSRMC - Individual Colleges">FCSRMC - Individual Colleges</button>
        <button class="tab-btn" data-sheet="Vendor Portals">Vendor Portals</button>
      </div>

      <div class="search-section">
        <div class="search-input-wrap">
          <input type="text" id="searchBox" class="search-box" placeholder="Search (Company)..." autocomplete="off" />
          <button type="button" id="clearSearchBtn" class="clear-btn hidden" aria-label="Clear search" title="Clear">×</button>
        </div>
        <div id="stats" class="stats">Loading data...</div>
      </div>

      <div id="content" class="loading">Loading records from DynamoDB...</div>

      <div class="load-more-wrap">
        <button id="loadMoreBtn" class="load-more-btn hidden">Load more</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIG
    const READ_API_BASE_URL = "https://joggcs6iisqlsyjjxxebho7e540yajvo.lambda-url.us-east-1.on.aws/";
    const PAGE_SIZE = 50;

    // Column order — loaded dynamically from the API per sheet
    let FIELD_ORDER = [];

    // ==============================
    // STATE
    // ==============================
    let allData = [];
    let nextKey = null;
    let lastQuery = "";
    let isLoading = false;
    let totalCount = null;
    let matchedTotal = null;
    let activeSheet = "National Account Protocols";

    // ==============================
    // AUTH
    // ==============================
    const COGNITO_DOMAIN = "https://national-account-protocol.auth.us-east-1.amazoncognito.com";
    const CLIENT_ID = "7si5kk2t9t24nrtgkumc2n6ops";
    const REDIRECT_URI = window.location.origin + "/";

    function decodeJwtPayload(token) {
      try {
        const base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(atob(base64));
      } catch (e) { return null; }
    }

    function displayUserInfo(idToken) {
      const payload = decodeJwtPayload(idToken);
      if (!payload) return;
      const name = payload.name || payload.email || payload["cognito:username"] || "Authenticated User";
      document.getElementById("userEmail").textContent = name;
    }

    function parseHashParams() {
      const hash = window.location.hash.substring(1);
      if (!hash) return null;
      const params = new URLSearchParams(hash);
      return params.get("id_token") ? params : null;
    }

    async function checkAuthState() {
      try {
        // Check for tokens in URL hash (implicit grant)
        const hashParams = parseHashParams();

        if (hashParams) {
          const idToken = hashParams.get("id_token");
          if (idToken) {
            localStorage.setItem("cognitoIdToken", idToken);
            localStorage.setItem("cognitoToken", "authenticated");
            displayUserInfo(idToken);
          } else {
            localStorage.setItem("cognitoToken", "authenticated");
            document.getElementById("userEmail").textContent = "Authenticated User";
          }
          // Clear the hash from the URL
          window.history.replaceState({}, document.title, window.location.pathname);
          showMainApp();
        } else {
          // Also handle legacy code= flow in case it's still in the URL
          const urlParams = new URLSearchParams(window.location.search);
          const code = urlParams.get("code");
          if (code) {
            localStorage.setItem("cognitoToken", "authenticated");
            document.getElementById("userEmail").textContent = "Authenticated User";
            window.history.replaceState({}, document.title, window.location.pathname);
            showMainApp();
          } else {
            const token = localStorage.getItem("cognitoToken");
            if (token) {
              const idToken = localStorage.getItem("cognitoIdToken");
              if (idToken) { displayUserInfo(idToken); }
              else { document.getElementById("userEmail").textContent = "Authenticated User"; }
              showMainApp();
            } else {
              showAuthScreen();
            }
          }
        }
      } catch (e) {
        showAuthScreen();
      }
    }

    function showAuthScreen() {
      document.getElementById("authScreen").classList.remove("hidden");
      document.getElementById("mainApp").classList.add("hidden");
      localStorage.removeItem("cognitoToken");
      localStorage.removeItem("cognitoIdToken");
    }

    function showMainApp() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      localStorage.setItem("cognitoToken", "authenticated");
      loadFirstPage();
    }

    document.getElementById("loginBtn").addEventListener("click", () => {
      window.location.href =
        COGNITO_DOMAIN + "/oauth2/authorize" +
        "?identity_provider=OktaNAP" +
        "&client_id=" + CLIENT_ID +
        "&response_type=code" +
        "&scope=email+openid+profile" +
        "&redirect_uri=" + encodeURIComponent(REDIRECT_URI);
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("cognitoToken");
      localStorage.removeItem("cognitoIdToken");
      window.location.href =
        COGNITO_DOMAIN + "/logout" +
        "?client_id=" + CLIENT_ID +
        "&logout_uri=" + encodeURIComponent(REDIRECT_URI);
    });

    // ==============================
    // HELPERS
    // ==============================
    function normalizeKey(s) {
      return String(s ?? "")
        .replace(/\r\n/g, "\n")
        .replace(/\s+/g, " ")
        .replace(/\s*\n\s*/g, "\n")
        .trim();
    }

    function buildKeyMap(record) {
      const map = new Map();
      Object.keys(record || {}).forEach(k => {
        map.set(normalizeKey(k), k);
      });
      return map;
    }

    function getCompanyTitle(record) {
      return (
        record.Company ||
        record.company ||
        record["Company (Full Legal Name)"] ||
        record["Portal Name"] ||
        "Company"
      );
    }

    function renderSkeleton() {
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="records-grid">
          ${Array.from({ length: 6 }).map(() => `
            <div class="skeleton-card">
              <div class="sk-line w60"></div>
              <div class="sk-line w80"></div>
              <div class="sk-line w40"></div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showLoadMoreButton(show) {
      const btn = document.getElementById("loadMoreBtn");
      if (show) btn.classList.remove("hidden");
      else btn.classList.add("hidden");
    }

    function setLoadMoreLoading(loading) {
      const btn = document.getElementById("loadMoreBtn");
      btn.disabled = loading;
      btn.textContent = loading ? "Loading..." : "Load more";
    }

    function updateStatsRange() {
      const stats = document.getElementById("stats");
      const loaded = allData.length;

      if (lastQuery && typeof matchedTotal === "number") {
        const start = loaded > 0 ? 1 : 0;
        const end = loaded;
        stats.textContent = `Showing ${start}–${end} of ${matchedTotal} matches`;
        return;
      }

      if (typeof totalCount === "number") {
        const start = loaded > 0 ? 1 : 0;
        const end = loaded;
        stats.textContent = `Showing ${start}–${end} of ~${totalCount} records`;
      } else {
        stats.textContent = `Loaded ${loaded} records`;
      }
    }

    function updateStats() { updateStatsRange(); }
    function prettyLabel(label) { return normalizeKey(label); }

    function toggleCard(header) {
      const card = header.parentElement;
      card.classList.toggle("expanded");
    }

    // ==============================
    // RENDER
    // ==============================
    function displayRecords(records) {
      const content = document.getElementById("content");

      if (!records || records.length === 0) {
        content.innerHTML = `<div class="no-results">No records found.</div>`;
        return;
      }

      records = [...records].sort((a, b) =>
        String(getCompanyTitle(a)).localeCompare(String(getCompanyTitle(b)))
      );

      const grid = document.createElement("div");
      grid.className = "records-grid";

      records.forEach((record) => {
        const card = document.createElement("div");
        card.className = "record-card";

        const title = getCompanyTitle(record);
        const keyMap = buildKeyMap(record);

        const excludedNormalizedKeys = new Set([
          normalizeKey("Company"),
          normalizeKey("company"),
          normalizeKey("SourceSheet"),
          normalizeKey("CompanyName")
        ]);

        let fieldsHtml = "";

        const fieldList = FIELD_ORDER.length > 0
          ? FIELD_ORDER
          : Object.keys(record).filter(k => !excludedNormalizedKeys.has(normalizeKey(k)));

        fieldList.forEach(label => {
          const normalizedLabel = normalizeKey(label);
          const originalKey = keyMap.get(normalizedLabel);

          if (!originalKey) return;
          if (excludedNormalizedKeys.has(normalizedLabel)) return;

          const value = record[originalKey];
          if (value === null || value === undefined) return;

          const str = Array.isArray(value) ? value.join(", ") : String(value);
          const normalizedValue = str.trim().toLowerCase();

          if (
            normalizedValue === "" ||
            normalizedValue === "n/a" ||
            normalizedValue === "na" ||
            normalizedValue === "n//a"
          ) {
            return;
          }

          fieldsHtml += `
            <div class="field-row">
              <div class="field-label">${prettyLabel(label)}</div>
              <div class="field-value">${str}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="record-header" onclick="toggleCard(this)">
            ${title}
            <span class="expand-icon">▼</span>
          </div>
          <div class="record-content">
            <div class="field-grid">${fieldsHtml}</div>
          </div>
        `;

        grid.appendChild(card);
      });

      content.innerHTML = "";
      content.appendChild(grid);
    }

    // ==============================
    // API CALL
    // ==============================
    async function fetchPage({ query, reset }) {
      if (isLoading) return;
      isLoading = true;

      try {
        if (reset) {
          allData = [];
          nextKey = null;
          matchedTotal = null;
          showLoadMoreButton(false);
          renderSkeleton();
        }

        const params = new URLSearchParams();
        if (query) params.set("q", query);
        params.set("limit", String(PAGE_SIZE));
        params.set("sheet", activeSheet);
        if (nextKey) params.set("lastKey", JSON.stringify(nextKey));

        const url = `${READ_API_BASE_URL}?${params.toString()}`;
        const res = await fetch(url, { method: "GET", mode: "cors" });

        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText} - ${text}`);
        }

        const payload = await res.json();
        matchedTotal = (typeof payload.matchedTotal === "number") ? payload.matchedTotal : null;

        if (Array.isArray(payload.columns) && payload.columns.length > 0) {
          FIELD_ORDER = payload.columns;
        }

        const items = Array.isArray(payload.items) ? payload.items : [];
        nextKey = payload.nextKey || null;

        if (typeof payload.total === "number") totalCount = payload.total;

        allData = allData.concat(items);
        displayRecords(allData);
        updateStats();

        if (payload.mode === "exact_record") {
          showLoadMoreButton(false);
        } else {
          showLoadMoreButton(!!nextKey);
        }
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById("content").innerHTML =
          `<div class="no-results">Error loading data: ${err.message}</div>`;
        showLoadMoreButton(false);
      } finally {
        isLoading = false;
        setLoadMoreLoading(false);
      }
    }

    // ==============================
    // WIRES
    // ==============================
    function loadFirstPage() {
      lastQuery = "";
      fetchPage({ query: "", reset: true });
    }

    let searchTimer = null;
    const searchBoxEl = document.getElementById("searchBox");
    const clearBtnEl = document.getElementById("clearSearchBtn");

    function syncClearButton() {
      if (searchBoxEl.value && searchBoxEl.value.length > 0) {
        clearBtnEl.classList.remove("hidden");
      } else {
        clearBtnEl.classList.add("hidden");
      }
    }

    clearBtnEl.addEventListener("click", () => {
      searchBoxEl.value = "";
      lastQuery = "";
      syncClearButton();
      searchBoxEl.focus();
      searchBoxEl.dispatchEvent(new Event("input", { bubbles: true }));
    });

    searchBoxEl.addEventListener("keydown", (e) => {
      if (e.key === "Escape") clearBtnEl.click();
    });

    searchBoxEl.addEventListener("input", (e) => {
      syncClearButton();
      lastQuery = e.target.value.trim();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        setLoadMoreLoading(false);
        fetchPage({ query: lastQuery, reset: true });
      }, 250);
    });

    document.getElementById("loadMoreBtn").addEventListener("click", () => {
      setLoadMoreLoading(true);
      fetchPage({ query: lastQuery, reset: false });
    });

    // Tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.sheet === activeSheet) return;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeSheet = btn.dataset.sheet;
        searchBoxEl.value = "";
        lastQuery = "";
        syncClearButton();
        fetchPage({ query: "", reset: true });
      });
    });

    syncClearButton();
    checkAuthState();
  </script>
</body>
</html>
